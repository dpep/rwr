# rwr's skill ships through the *private* marketplace, not code@dpep, until it
# has real mileage. Without this the release copies it to
# ~/code/lib/claude/plugins/code/skills/rwr/SKILL.md -- the wrong marketplace --
# and bumps a plugin manifest that does not exist here.
#
# Sourced after the script computes its defaults, so these win.
PLUGINS_REPO="$HOME/code/lib/myclaude"
SKILL_DST="$PLUGINS_REPO/plugins/rwr/skills/rwr/SKILL.md"
PLUGIN_MANIFEST="$PLUGINS_REPO/plugins/rwr/.claude-plugin/plugin.json"
