name: hash rocket and redundant pair -> shorthand
family: syntactic
source: author's wanted-rules list - Style/HashSyntax
notes: >
  Exercises two things at once. The rocket and the label parse to the same node,
  so one pattern covers both spellings -- spelling is opt-in, not baked into
  equality. And `{foo: foo}` -> `{foo:}` needs name equality across *kinds*: a
  symbol key against a variable read, which AST equality cannot express.
notes_on_layout: >
  The multiline entry is the minimal-diff regression. Before sequence-aware
  alignment, `{**$BEFORE, $K: $V, **$AFTER}` fell through to whole-node
  replacement, so every multiline hash came back on one line with its trailing
  comma gone -- rwr breaking its own promise not to own style, on the rule with
  the most sites to change.
predicates_required:
  - cross-capture name equality (same_name_as)
  - double-splat sequence placeholders, to reach one pair among many
notes_on_passes: >
  Every redundant pair in one hash converts in a single pass (D118). Each split
  of the double-splats binds a different pair, so each is its own match, and
  their minimal edits touch disjoint bytes of the shared hash -- which is what
  D15's edit-range conflict unit was always for. This needed one pass per pair
  until D118, while reporting success after the first.

  The backtracking Q13 added still carries the other half: binding `$K` to an
  already-shortened `name:` fails `same_name_as`, and forbidding that binding
  and retrying is what lets the neighbours convert. The corpus runner still
  applies to a fixpoint, because a rule whose bindings genuinely conflict is
  reported as retryable rather than dropped.
competitors:
  ast-grep: inexpressible - no cross-capture relation
  comby: inexpressible
