# One pattern covers both spellings: `foo: foo` and `:foo => foo` parse to the
# same node, so the rocket needs no separate rule.
description: Ruby 3.1+ shorthand for a hash entry whose key and value share a name.
ruby: '3.1'
match: '{**$BEFORE, $K: $V, **$AFTER}'
where:
  $K:
    same_name_as: $V
rewrite: '{**$BEFORE, $K:, **$AFTER}'
tests:
  - input: |
      h = { name: name }
    output: |
      h = { name: }
  - input: |
      h = { name: other }
    unchanged: true
  # `{name: :name}` is a symbol value, not a read of `name`. The shorthand
  # would make it call the method instead -- a different program, and one that
  # still parses, so no `ruby -c` oracle catches it.
  - input: |
      h = { name: :name }
    unchanged: true
  - input: |
      h = { :name => :name }
    unchanged: true
  # The same trap one node kind over: `a()` names the *method* outright, while
  # `a:` prefers a local of that name. With both in scope they are different
  # programs -- `{a: a()}` is 99, `{a:}` is 1 -- and both parse.
  - input: |
      def a = 99
      a = 1
      h = { a: a() }
    unchanged: true
  # An ivar is not the identifier the shorthand would read; `{name:}` would find
  # the method or local instead.
  - input: |
      h = { name: @name }
    unchanged: true
  # Nor is an explicit receiver. `self.name` names one method; `name:` resolves a
  # local first and reaches a private method where `self.` cannot.
  - input: |
      h = { name: self.name }
    unchanged: true
  # A keyword parameter's *default*, which wears the same shape and is not a
  # hash. `def m(name:)` makes the keyword required -- a different signature, and
  # a TypeError at every existing call site that omitted it.
  - input: |
      def m(name: name)
        name
      end
    unchanged: true
  # A constant reads its identifier like any other name, and Ruby's shorthand
  # resolves it the same way, so this one must *not* be declined -- the fix that
  # closed `{a: :a}` had to stop at literals, not at every non-local.
  - input: |
      h = { Name: Name }
    output: |
      h = { Name: }
  # The double splats are not decoration: they let the pair sit anywhere in the
  # hash. A splat either side must survive untouched.
  - input: |
      h = { **before, name: name, **after }
    output: |
      h = { **before, name:, **after }
  # RED, and left red on purpose: a second pair in the same hash is dropped.
  # Both matches cover the whole hash node, so they overlap and only one
  # survives -- and the run says `rewrote 1 site(s)` and exits 0, so the caller
  # believes it is done. Every edit made is correct; the diff is simply half a
  # conversion, which is the shape a reviewer sends back.
  - input: |
      h = { name: name, value: value }
    output: |
      h = { name:, value: }
