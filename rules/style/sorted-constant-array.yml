# Scoped to constants deliberately. Array order is usually *meaning* -- a
# priority list, ordered arguments, a migration sequence -- and sorting one is
# then a bug rather than a tidy-up. A screaming-snake constant is the case where
# order is conventionally presentation, so that is the case this ships.
#
# Comments travel with the element on their line (D35); an element sharing a
# line with a comment that could describe either neighbour is refused rather
# than guessed at.
description: Alphabetise the elements of a constant array literal.
unsafe: >-
  A constant array's order can still be meaning -- PRIORITY_ORDER, a migration sequence -- and sorting one is then a bug.
match: $C = [*$ITEMS]
where:
  $C:
    is: constant
rewrite: $C = [*$ITEMS.sort]
tests:
  - input: |
      PERMS = [:zebra, :apple]
    output: |
      PERMS = [:apple, :zebra]
  - input: |
      order = [:zebra, :apple]
    unchanged: true
