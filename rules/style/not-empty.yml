# Requested as an unconditional inverse; it is not one, and the pack's answer to
# "usually right, occasionally a bug" is `unsafe:` with the reason attached.
#
#   ![nil, false].empty?  # => true
#   [nil, false].any?     # => false
#
# `any?` without a block asks whether any element is *truthy*, not whether any
# element exists. And `empty?` is common on strings, where `any?` does not exist
# at all: `"abc".any?` is a NoMethodError.
#
# The blockful form is the safe one and ships separately, in style/inverse-any.
description: '`!x.empty?` is a double negative; `x.any?` reads forwards.'
unsafe: >-
  `any?` without a block tests truthiness, not presence -- `![nil].empty?` is true where `[nil].any?` is false -- and String has no `any?` at all.
match: '!$X.empty?'
rewrite: $X.any?
tests:
  - input: |
      a = !xs.empty?
    output: |
      a = xs.any?
  - input: |
      a = !xs.empty? { |x| x }
    unchanged: true
