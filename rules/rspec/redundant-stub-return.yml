# Two literal chains rather than one `contains:`, because "a stub returns nil
# already" holds only when *nothing earlier in the chain set an implementation*,
# and `contains: receive($M)` cannot see that. Verified against rspec-mocks 3.13:
#
#   receive(:each).and_yield(1).and_return(nil)   -> yields, returns the block's value
#   receive(:bar).and_return(1).and_return(nil)   -> returns 1
#   receive(:bar).and_raise(Err).and_return(nil)  -> raises; `and_return(nil)`
#                                                    was suppressing the raise
#
# `contains:` admitted all three, so the "redundant" removal changed what the
# stub did -- and in the `and_raise` case turned a nil into an exception.
#
# The fix is an allowlist of chain shapes, not a `name_not:` denylist of
# `and_yield`/`and_raise`/`and_return`. A denylist restates rspec-mocks' set of
# implementation-setting methods, and will drift from it the next time that gem
# grows one: it fails *open*, rewriting the new spelling silently. Spelling the
# safe chains out fails closed -- an unlisted chain is simply not matched.
#
# It also closes the `do`/`end` hole by construction. `receive(:bar) do 42 end`
# binds its block to `to`, not to `receive`, so `contains:` found the bare
# `receive(:bar)` inside and the whole `allow(...).to ... end` was the capture.
# Here the receiver must *be* `receive($M)` or `receive($M).with(...)`, and the
# `to` call is neither.
#
# Coverage is not theoretical: all 11 sites this finds on mastodon are one of
# these two shapes.
#
# `and_return(nil, 1)` is a different node -- two arguments, a queue of return
# values -- and does not match, which is the whole reason to match structurally.
- description: A stub returns nil already; `.and_return(nil)` says it twice.
  match: receive($M).and_return(nil)
  rewrite: receive($M)
  tests:
    - input: |
        allow(foo).to receive(:bar).and_return(nil)
      output: |
        allow(foo).to receive(:bar)
    - input: |
        allow(foo).to receive(:bar).and_return(nil, 1)
      unchanged: true
    - input: |
        thing.and_return(nil)
      unchanged: true

    # The real-world shape: the chain broken across lines, whole `.and_return`
    # line removed.
    - input: |
        allow(foo)
          .to receive(:bar)
          .and_return(nil)
      output: |
        allow(foo)
          .to receive(:bar)

    # A block on `receive` is an implementation, in either spelling. The brace
    # form binds to `receive` and the `do`/`end` form binds to `to`; neither is
    # the node `receive($M)`, so both are declined.
    - input: |
        allow(foo).to receive(:bar) { 42 }.and_return(nil)
      unchanged: true
    - input: |
        allow(foo).to receive(:bar) do
          42
        end.and_return(nil)
      unchanged: true

    # The three chains that set an implementation before the `and_return(nil)`.
    # Removing it changes what the stub returns, and for `and_raise` turns a nil
    # into a raise.
    - input: |
        allow(foo).to receive(:each).and_yield(1).and_return(nil)
        allow(foo).to receive(:bar).and_return(1).and_return(nil)
        allow(foo).to receive(:bar).and_raise(ArgumentError).and_return(nil)
      unchanged: true

- description: A stub returns nil already; `.and_return(nil)` says it twice.
  match: receive($M).with(*$A).and_return(nil)
  rewrite: receive($M).with(*$A)
  tests:
    - input: |
        expect(foo).to receive(:bar).with(1).and_return(nil)
      output: |
        expect(foo).to receive(:bar).with(1)
    - input: |
        allow(foo).to receive(:bar).with(1, anything).and_return(nil)
      output: |
        allow(foo).to receive(:bar).with(1, anything)

    # A block after `with` is the implementation, not an argument matcher.
    - input: |
        allow(foo).to receive(:bar).with(1) { 42 }.and_return(nil)
      unchanged: true

    # `with` after an implementation is still an implementation first.
    - input: |
        allow(foo).to receive(:bar).and_raise(ArgumentError).with(1).and_return(nil)
      unchanged: true
