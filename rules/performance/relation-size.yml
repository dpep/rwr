# A lint, not a rewrite: `.size` on a relation is `count` when the relation is
# unloaded and `length` when it is loaded, and which one the author wanted is a
# question about code rwr cannot see. Flagging it is the honest answer.
#
# **It stays quiet on a real app, and `where` is why.** Measured: 0 sites across
# mastodon, which writes 113 `.size` calls in `app/` and never one after a
# `where`; 12 on rails, all in ActiveRecord's own tests. Widening the receiver
# to "a `where` anywhere inside it" was measured too -- 19 on rails, still 0 on
# mastodon, and it admits `relation.pluck(:id).size`, which is an Array's size.
# So it was not taken: it bought noise, not reach.
#
# The shape that would actually pay -- `account.posts.size` on a `has_many` --
# has no syntactic tell at all. It is `$R.$M.size`, which is also
# `hash.keys.size`. Reaching it needs a receiver that resolves to
# `ActiveRecord::Relation`, not a better pattern.
description: '`.size` on a relation queries when unloaded and counts in memory when loaded; say which you meant.'
unsafe: >-
  Assumes an ActiveRecord relation. `where` on anything else is a different
  method entirely.
match: $R.where(*$C).size
tests:
  - input: |
      n = Model.where(x: 1).size
    finds: 1
  # `.length` and `.count` already say which they meant.
  - input: |
      n = Model.where(x: 1).length
    finds: 0
  # The question is about a relation, not any receiver with a `size`.
  - input: |
      n = [1, 2].size
    finds: 0
  # A hash condition with several keys is still one argument.
  - input: |
      n = Model.where(x: 1, y: 2).size
    finds: 1
  # A string condition is the other half of `where` and takes two arguments.
  # `($C)` bound one and was blind to these; `(*$C)` covers every arity.
  - input: |
      n = Model.where('x = ?', 1).size
    finds: 1
  # `where` is not a relation, only a hint of one: any receiver with a one-arg
  # `where` matches, and rwr has no way to tell them apart. Pinned so the
  # over-match is on the record next to the under-match below.
  - input: |
      n = config.where(x: 1).size
    finds: 1
  # Anything chained after `where` hides the site: the shape anchors `.size`
  # directly to the `where` call. Pinned as an under-match, not endorsed --
  # loosening the anchor to "a `where` anywhere in the receiver" was measured
  # and rejected (below).
  - input: |
      n = Model.where(x: 1).order(:id).size
      m = Model.where(x: 1).includes(:parts).size
    finds: 0
