# A lint, and a noisy one by construction. `contains:` can say "this block
# reaches through its own parameter", which is the N+1 *shape*; it cannot say
# "and nothing upstream called `includes`", because that is a negative condition
# over a scope rwr does not analyse -- usually a different method entirely.
#
# So this finds candidates, not defects. It is worth having anyway: the shape is
# rare enough per file to skim, and every real N+1 is in here somewhere.
id: performance/possible-n-plus-one
description: >-
  A block reaching through its own element to a further association -- the N+1
  shape. rwr cannot see whether the relation was eager-loaded, so this is a
  candidate to check, not a defect.
unsafe: >-
  Flags the shape only. A preloaded association is indistinguishable from a
  lazy one without knowing what the caller did.
match: $R.$ITER { |$X| $B }
where:
  $ITER:
    name: [each, map, flat_map, select, filter_map, each_with_object, sum]
  $B: { contains: $X.$ASSOC.$FIELD }
tests:
  # Reaching through the block's own element to a further association.
  - input: |
      orders.each { |o| puts o.customer.name }
    finds: 1
  # Reaching through something else is somebody else's object, not an N+1.
  - input: |
      orders.each { |o| puts other.customer.name }
    finds: 0
  # One hop is a plain attribute read.
  - input: |
      orders.each { |o| puts o.name }
    finds: 0
  # A non-iterating method is not the shape at all.
  - input: |
      orders.tap { |o| puts o.customer.name }
    finds: 0
  # The hop may be conditional or nested; it is still a hop per element.
  - input: |
      orders.each { |o| puts o.customer.name if o.active? }
    finds: 1
  # Iterators the `name:` list does not carry. `detect` stops early, which
  # bounds the damage, but `each_with_index` does not -- it is the same N+1
  # with a counter, and it goes unreported.
  - input: |
      orders.detect { |o| o.customer.name }
      orders.each_with_index { |o, i| puts o.customer.name }
    finds: 0
  # RED, deliberately -- the rule's own third case says a plain attribute read
  # is not an N+1, and a coercion of one is still a plain attribute read.
  # `$ASSOC.$FIELD` counts hops, not associations, so `id` + `to_s` reads as a
  # chain through an association. This is the single largest source of noise:
  # 26 of 91 findings on a real app are a two-hop chain ending in `to_s`,
  # `to_i`, `strip` or `downcase`, and 36 of the 91 are in spec files. A
  # candidate list is only worth skimming if skimming it is cheaper than
  # skimming the code.
  - input: |
      ids = accounts.map { |a| a.id.to_s }
    finds: 0
  # RED, deliberately -- the `unsafe:` note's justification is that rwr
  # "cannot see whether the relation was eager-loaded". Here it can: the
  # `includes` names the very association the block reaches through, in the
  # same expression, inside the matched receiver. Four findings on a real app
  # are this shape.
  - input: |
      orders.includes(:customer).each { |o| puts o.customer.name }
    finds: 0
