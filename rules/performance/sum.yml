# `inject(:+)` sends `+` once per element; `Array#sum` has a C fast path for
# numerics. It stays a rewrite -- unlike `pluck`, every way it can go wrong is
# either loud or an improvement -- but the caveat has to name all of them,
# because the receiver's element type is the thing rwr cannot see and the
# caller can.
description: '`inject(:+)` is `sum`, which has a fast path for numerics.'
unsafe: >-
  Only equivalent for a non-empty collection of numerics. On an empty one
  `inject(:+)` returns nil and `sum` returns 0. On anything else `sum` raises,
  because its accumulator starts at 0: `['a', 'b'].inject(:+)` is "ab" and
  `['a', 'b'].sum` is a TypeError, and arrays of arrays fail the same way. On
  floats it returns a *different number* and says nothing -- `sum` compensates
  for rounding and `inject` does not, so [0.1, 0.2, 0.3] gives 0.6 rather than
  0.6000000000000001. And on an ActiveRecord relation `sum` is ActiveRecord's
  method rather than Enumerable's: with no block it goes to the database
  instead of reducing the records.
match: $R.$RED(:+)
where:
  $RED:
    name: [inject, reduce]
rewrite: $R.sum
tests:
  - input: |
      a = xs.inject(:+)
    output: |
      a = xs.sum
  - input: |
      a = xs.reduce(:+)
    output: |
      a = xs.sum
  # An explicit initial value already says what the empty case returns, and
  # `sum` takes it in a different position -- a different rewrite, not this one.
  - input: |
      a = xs.inject(0, :+)
    unchanged: true
  # Any other operator, and the long-hand block, are other reductions.
  - input: |
      a = xs.inject(:*)
      b = xs.inject { |acc, x| acc + x }
    unchanged: true
  # PINNED, not endorsed. This rewrite turns working code into a TypeError, and
  # the receiver says so on its own line -- but nothing in the rule language
  # can decline it. `is:` asserts a node kind and cannot be negated, and
  # `type_not:` only excludes receivers it can *resolve*, so demanding one here
  # would drop `xs.inject(:+)` along with it -- every real receiver is a bare
  # local. So the caveat carries it: the rule is held back unless `--unsafe`,
  # and the reason prints next to this diff.
  - input: |
      a = ['a', 'b'].inject(:+)
    output: |
      a = ['a', 'b'].sum
