# Reports; it does not rewrite. The two forms return different things: `each`
# returns its receiver, so `xs.reverse.each {}` evaluates to the reversed copy
# while `xs.reverse_each {}` evaluates to `xs` in its original order. They are
# interchangeable exactly where the value is discarded, and `where:` has no way
# to say that -- "is this expression in void context" is a fact about the
# statement around the match, not about the match.
#
# So this is the case the docs describe for a finding: the right answer depends
# on something rwr cannot see. A reader answers it in one look -- is the value
# assigned, chained, returned or passed? -- which is why reporting is worth more
# here than either a silent flip or nothing at all.
#
# *Not* deleted, and not `unsafe:`. Deleting was proposed on the measurement
# that rails and mastodon have zero sites; discourse has nine, every one of them
# void, and `docs/internal/phase0-results.md` already recorded five. The rule
# finds real code. `unsafe:` would gate it behind a run-level flag and then
# rewrite every site the run touched, including the ones a reader would have
# declined -- the flag says "I accept this hazard", not "check each site".
#
# The receiver hazard is the other way round from the obvious guess: `reverse`
# lives on Array and String only, while `reverse_each` comes from Enumerable and
# is on Hash, Range, Set and Enumerator too. String has no `each`, so every
# receiver reaching this rule at runtime is already an Array. There is nothing
# to guard there.
description: '`reverse.each` allocates a reversed copy; where the value is discarded, `reverse_each` iterates backwards in place.'
match: $R.reverse.each { |$P| $B }
tests:
  - input: |
      xs.reverse.each { |x| p x }
    finds: 1

  # The reason there is no `rewrite:`. `each` returns the receiver, so rewriting
  # any of these flips the value of the expression from reversed to original
  # order -- assigned, chained, and passed as an argument. They are still
  # reported: a finding is a question for the reader, and these are the sites
  # where the answer is no.
  - input: |
      a = xs.reverse.each { |x| p x }
      xs.reverse.each { |x| p x }.first
      consume(xs.reverse.each { |x| p x })
    finds: 3

  - input: |
      xs.reverse.each do |x|
        p x
      end
    finds: 1

  # Safe navigation below the pattern root is NOT matched, since D115: a
  # pattern's `.` matches `&.` only at the root. That rule exists because a
  # rewrite below the root can change what consuming a short-circuited nil
  # means -- which cannot happen here, because this rule proposes no edit.
  # So this is a coverage gap in a lint, not a hazard: the site is real and
  # goes unreported. Closing it means spelling the safe-navigated chain out as
  # its own pattern, and the mixed spellings (`xs.reverse&.each`,
  # `xs&.reverse.each`) multiply. Pinned as it behaves, not as it should.
  - input: |
      xs&.reverse&.each { |x| p x }
    finds: 0

  # Anything between `reverse` and `each` makes the copy load-bearing.
  - input: |
      xs.reverse.uniq.each { |x| p x }
    finds: 0

  - input: |
      xs.reverse.map { |x| x }
    finds: 0
