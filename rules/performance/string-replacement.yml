# `tr` maps character by character, so this is valid only when both arguments
# are one-character string literals -- `gsub("ab", "cd")` is a different
# operation. `length: 1` is what makes the rule safe rather than plausible, and
# `is: string` keeps an interpolated `"#{x}"` out.
#
# The `unsafe:` note used to warn that `tr` gives `^` and `\` special meaning.
# It does -- but not at `length: 1`, where negation has no character to negate
# and a lone backslash has nothing to escape. Every single-character pair over
# printable ASCII plus `\n`, `\t` and `\0` agrees between `gsub` and `tr`: zero
# divergent pairs. The fixtures at the bottom hold the two the old note named.
# What is left unpinned is the receiver, which is what the note says now.
description: '`gsub` with single-character literals is `tr`, which needs no regex engine.'
unsafe: >-
  `tr` is a String method and nothing here pins the receiver to a String, so a receiver that defines `gsub` without `tr` starts raising `NoMethodError`.
match: $R.gsub($FROM, $TO)
where:
  $FROM:
    is: string
    length: 1
  $TO:
    is: string
    length: 1
rewrite: $R.tr($FROM, $TO)
tests:
  - input: |
      a = s.gsub("-", "_")
    output: |
      a = s.tr("-", "_")
  - input: |
      a = s.gsub("ab", "cd")
    unchanged: true
  - input: |
      a = s.gsub(/x/, "y")
    unchanged: true

  # `length:` counts characters of the *unescaped* value, which is the only
  # reading that makes both of these right: `"\n"` is two characters of source
  # and one of content, `"é"` is one character and two bytes.
  - input: |
      a = s.gsub("\n", " ")
    output: |
      a = s.tr("\n", " ")
  - input: |
      a = s.gsub("é", "e")
    output: |
      a = s.tr("é", "e")

  # What `is: string` is for: the value is one character only at runtime, so
  # there is nothing to check at rewrite time.
  - input: |
      a = s.gsub("#{x}", "y")
    unchanged: true
  - input: |
      a = s.gsub(SEP, "_")
    unchanged: true

  # `""` is not one character, and a block or a `!` is a different method.
  - input: |
      a = s.gsub("a", "")
    unchanged: true
  - input: |
      a = s.gsub("a") { |m| m.upcase }
    unchanged: true
  - input: |
      s.gsub!("-", "_")
    unchanged: true

  - input: |
      a = s&.gsub("-", "_")
    output: |
      a = s&.tr("-", "_")

  # The two characters the old `unsafe:` note warned about. At `length: 1` both
  # are literals in `tr` as well: negation needs a character after the `^`, and
  # a trailing backslash has nothing to escape.
  - input: |
      a = s.gsub("^", "*")
    output: |
      a = s.tr("^", "*")
  - input: |
      a = s.gsub("\\", "/")
    output: |
      a = s.tr("\\", "/")
