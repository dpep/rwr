[package]
name = "rwr"
version = "0.3.0"
edition = "2024"
description = "Ruby structural search and rewrites"
license = "MIT"
repository = "https://github.com/dpep/rwr"
build = "build.rs"
# The rule pack is compiled in, but ship the sources too: they are the
# documentation for writing your own.
include = ["src/**", "build.rs", "rules/**", "README.md", "LICENSE*", "CHANGELOG.md"]

[[bin]]
name = "rwr"
path = "src/main.rs"

# Allow-by-default upstream. `pub` on an item inside a private module is
# reachable from nowhere, yet `pub` is exactly what makes the dead_code lint
# skip an item — so it costs API surface and buys blindness.
[lints.rust]
unreachable_pub = "warn"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ignore = "0.4"
# SIMD substring search: the prefilter reads every file, so the scan is
# dominated by searching rather than by parsing.
memchr = "2"
memmap2 = "0.9"
rayon = "1"
ruby-prism = "1"

[dev-dependencies]
tempfile = "3"
