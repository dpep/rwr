name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, edited, synchronize ]

jobs:
  test:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v7

      - name: setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2

      # The repo's own gate is the single definition of green -- CI runs the
      # same command a human runs before pushing, so the two cannot drift.
      - name: check
        run: ./script/check.sh
